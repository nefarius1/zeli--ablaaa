<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>balonbalığıkraliçesizera</title>

<style>

body{
    margin:0;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(to bottom,#001f3f,#0074D9);
    font-family:Arial,sans-serif;
}

/* Neon Yazı */

h1{
    color:#fff;
    font-size:55px;
    text-align:center;
    text-shadow:
    0 0 5px #fff,
    0 0 10px #ff00ff,
    0 0 20px #ff00ff,
    0 0 40px #ff00ff;
    animation:parla 2s infinite alternate;
    z-index:2;
}

@keyframes parla{
    from{
        opacity:0.8;
    }
    to{
        opacity:1;
    }
}

/* Balık */

.fish{
    width:230px;
    height:230px;
    background:#ffd166;
    border-radius:50%;
    position:relative;
    animation:yuz 4s ease-in-out infinite;
    box-shadow:0 0 40px rgba(255,255,255,0.6);
    z-index:2;
}

.eye{
    width:30px;
    height:30px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:70px;
}

.eye::after{
    content:"";
    width:12px;
    height:12px;
    background:black;
    border-radius:50%;
    position:absolute;
    top:9px;
    left:9px;
}

.left{
    left:55px;
}

.right{
    right:55px;
}

.mouth{
    width:60px;
    height:30px;
    border-bottom:5px solid black;
    border-radius:0 0 50px 50px;
    position:absolute;
    top:130px;
    left:85px;
}

.fin{
    width:70px;
    height:70px;
    background:#ffb347;
    border-radius:50%;
    position:absolute;
    top:75px;
    z-index:-1;
}

.fin1{
    left:-25px;
}

.fin2{
    right:-25px;
}

@keyframes yuz{
    0%{
        transform:translateY(0px) translateX(0px);
    }
    25%{
        transform:translateY(-20px) translateX(20px);
    }
    50%{
        transform:translateY(0px) translateX(-20px);
    }
    75%{
        transform:translateY(20px) translateX(20px);
    }
    100%{
        transform:translateY(0px) translateX(0px);
    }
}

/* Baloncuklar */

.bubble{
    position:absolute;
    bottom:-100px;
    background:rgba(255,255,255,0.5);
    border-radius:50%;
    animation:baloncuk linear infinite;
}

@keyframes baloncuk{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

</style>
</head>

<body>

<!-- Müzik -->
<audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- Baloncuklar -->
<script>
for(let i=0;i<40;i++){

    let bubble=document.createElement("div");
    bubble.classList.add("bubble");

    let size=Math.random()*30+10;

    bubble.style.width=size+"px";
    bubble.style.height=size+"px";

    bubble.style.left=Math.random()*100+"vw";

    bubble.style.animationDuration=(Math.random()*5+5)+"s";

    document.body.appendChild(bubble);
}
</script>

<!-- Balık -->

<div class="fish">

    <div class="fin fin1"></div>
    <div class="fin fin2"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="mouth"></div>

</div>

<h1>balonbalığıkraliçesizera</h1>

</body>
</html>
